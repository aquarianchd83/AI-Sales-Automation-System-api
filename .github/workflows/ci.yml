name: CI

on:
  push:
    branches: [master]
  pull_request:

# One run per branch/PR: a newer push cancels the older run instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WhatsAppSalesAutomation.sln

      # Warnings are not errors here (the code base predates this check), but the build itself must succeed.
      - name: Build
        run: dotnet build WhatsAppSalesAutomation.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test WhatsAppSalesAutomation.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"
          if-no-files-found: ignore
