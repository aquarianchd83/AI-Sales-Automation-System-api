# Self-hosted Evolution API (the QR-code WhatsApp bridge), pinned. Local/dev: `docker compose up -d`, API on http://localhost:8085.
# Copy .env.example to .env and set EVOLUTION_API_KEY first. The key is the bridge's master key - never commit .env.
services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    ports: ["8085:8080"]
    environment:
      SERVER_URL: http://localhost:8085
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?set EVOLUTION_API_KEY in .env}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_LOCAL_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
    depends_on: [postgres, redis]
    volumes: [evolution_instances:/evolution/instances]
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment: { POSTGRES_USER: evolution, POSTGRES_PASSWORD: evolution, POSTGRES_DB: evolution }
    volumes: [evolution_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
volumes: { evolution_instances: {}, evolution_pg: {} }
